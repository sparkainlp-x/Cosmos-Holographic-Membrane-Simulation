<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AION: a browser-only research visualization of a 512-channel OES-32 latching simulation.">
  <title>AION — Holographic Membrane</title>
  <style>
    :root { color-scheme: dark; --cyan: #61f5ff; --ink: #061017; --panel: rgba(6, 16, 23, .78); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; background: var(--ink); color: #e5fcff; font: 14px/1.5 system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    main { position: relative; z-index: 1; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(1rem, 4vw, 3rem); pointer-events: none; }
    header, footer, .panel { width: min(100%, 34rem); padding: 1rem 1.2rem; border: 1px solid rgba(97, 245, 255, .28); background: var(--panel); box-shadow: 0 0 32px rgba(0, 211, 255, .08); backdrop-filter: blur(10px); pointer-events: auto; }
    h1 { margin: 0; letter-spacing: .3em; font-size: clamp(1.3rem, 3vw, 2rem); color: var(--cyan); }
    header p { margin: .35rem 0 0; color: #a5cdd3; }
    .panel { align-self: center; justify-self: end; max-width: 25rem; }
    .eyebrow { margin: 0 0 .8rem; color: var(--cyan); font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; }
    dl { display: grid; grid-template-columns: 1fr auto; gap: .4rem 1rem; margin: 0; }
    dt { color: #91b9bf; } dd { margin: 0; font-variant-numeric: tabular-nums; }
    footer { align-self: end; color: #91b9bf; font-size: .78rem; }
    button { margin-top: 1rem; padding: .55rem .8rem; border: 1px solid var(--cyan); background: transparent; color: var(--cyan); cursor: pointer; }
    button:hover, button:focus-visible { background: rgba(97, 245, 255, .15); }
    @media (max-width: 700px) { .panel { justify-self: start; align-self: end; margin-bottom: 1rem; } footer { display: none; } }
  </style>
</head>
<body>
  <canvas id="membrane" aria-label="Animated 3D holographic membrane visualization"></canvas>
  <main>
    <header><h1>AION</h1><p>Holographic membrane · OES-32 latch research visualization</p></header>
    <section class="panel" aria-live="polite">
      <p class="eyebrow">Browser-only simulation</p>
      <dl>
        <dt>Channels</dt><dd>512</dd>
        <dt>Fold</dt><dd>64 × 8</dd>
        <dt>Latch period τ</dt><dd>0.08</dd>
        <dt>Reference radius R</dt><dd id="radius">—</dd>
        <dt>State</dt><dd id="state">RUNNING</dd>
      </dl>
      <button id="toggle" type="button">Pause simulation</button>
    </section>
    <footer>Research visualization only. Not medical advice, certified hardware, or a performance claim.</footer>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#membrane');
      const ctx = canvas.getContext('2d');
      const radius = document.querySelector('#radius');
      const state = document.querySelector('#state');
      const toggle = document.querySelector('#toggle');
      const W = 512, TAU = 0.08;
      let width, height, paused = false, time = 0, previous = performance.now();
      const channels = Array.from({ length: W }, (_, i) => ({ i, phase: (i * 0.6180339887) % 1 }));
      const resize = () => {
        width = canvas.width = innerWidth * devicePixelRatio;
        height = canvas.height = innerHeight * devicePixelRatio;
        canvas.style.width = `${innerWidth}px`;
        canvas.style.height = `${innerHeight}px`;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        width = innerWidth; height = innerHeight;
      };
      const project = (x, y, z) => {
        const scale = 1 / (1 + z * .0022);
        return [width / 2 + x * scale, height / 2 + y * scale];
      };
      const draw = now => {
        const dt = Math.min((now - previous) / 1000, .05); previous = now;
        if (!paused) time += dt;
        ctx.fillStyle = '#061017'; ctx.fillRect(0, 0, width, height);
        const points = channels.map(({ i, phase }) => {
          const angle = i / W * Math.PI * 2;
          const wave = Math.sin(time * 2.2 + phase * 6.28) * 22;
          const x = Math.cos(angle) * (170 + wave) + Math.sin(time + angle * 3) * 26;
          const y = Math.sin(angle) * (100 + wave * .45) + Math.cos(time * 1.3 + angle * 2) * 20;
          const z = Math.sin(angle * 4 + time) * 80 + Math.cos(time + phase * 5) * 25;
          return project(x, y, z);
        });
        ctx.lineWidth = 1;
        for (let i = 0; i < W; i++) {
          const next = points[(i + 1) % W];
          ctx.strokeStyle = `hsla(${180 + (i % 64) * 1.5}, 90%, 65%, ${.14 + (i % 8) * .02})`;
          ctx.beginPath(); ctx.moveTo(...points[i]); ctx.lineTo(...next); ctx.stroke();
        }
        points.forEach(([x, y], i) => {
          ctx.fillStyle = `hsla(${175 + i % 70}, 100%, 70%, .8)`;
          ctx.fillRect(x - 1, y - 1, 2, 2);
        });
        const maxRadius = Math.max(...points.map(([x, y]) => Math.hypot(x - width / 2, y - height / 2)));
        radius.textContent = maxRadius.toFixed(1);
        requestAnimationFrame(draw);
      };
      toggle.addEventListener('click', () => {
        paused = !paused; state.textContent = paused ? 'PAUSED' : 'RUNNING';
        toggle.textContent = paused ? 'Resume simulation' : 'Pause simulation';
      });
      addEventListener('resize', resize); resize(); requestAnimationFrame(draw);
      // The model is intentionally illustrative: μ(i)=(i+256) mod 512 and SAFE=A∧C0∧C1∧C_fold.
      void TAU;
    })();
  </script>
</body>
</html>
